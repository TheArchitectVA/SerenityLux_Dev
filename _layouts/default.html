<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: "Serenity Lux Hair Extensions" }}</title>
    <!-- Tailwind CSS & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #ffffff; color: #222222; font-family: 'Inter', sans-serif; }
        .font-cinzel { font-family: 'Cinzel Decorative', Georgia, serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f9f9f9; }
        ::-webkit-scrollbar-thumb { background: #c5a059; border-radius: 4px; }
    </style>
</head>
<body class="antialiased selection:bg-[#c5a059] selection:text-white">

    <!-- Automatically pulls from _includes/header.html -->
    {% include header.html %}

    <!-- Page-specific content gets injected here -->
    <main>
        {{ content }}
    </main>

    <!-- Footer -->
    <footer class="bg-[#1a1a1a] text-gray-300 py-12 mt-20 text-center text-sm">
        <p>&copy; 2026 Serenity Lux Hair Extensions. All Rights Reserved.</p>
    </footer>

</body>
</html>
